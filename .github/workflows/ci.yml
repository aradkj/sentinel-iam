name: IAM Service CI/CD

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/aradkj/sentinel-iam-api
  FRONTEND_IMAGE: ghcr.io/aradkj/sentinel-iam-frontend

jobs:
  test-and-build:
    name: Test & Build Docker Images
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: iam_db
          POSTGRES_USER: iam_user
          POSTGRES_PASSWORD: iam_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iam_user -d iam_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate RSA keys for tests
        run: |
          mkdir -p security
          openssl genrsa -out security/private.pem 2048
          openssl rsa \
            -in security/private.pem \
            -pubout \
            -out security/public.pem

      - name: Compile Python code
        run: |
          python -m compileall -q app tests

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://iam_user:iam_password@localhost:5432/iam_db
          REDIS_URL: redis://localhost:6379/0
          JWT_ALGORITHM: RS256
          JWT_PRIVATE_KEY_PATH: security/private.pem
          JWT_PUBLIC_KEY_PATH: security/public.pem
        run: |
          alembic upgrade head

      - name: Run Pytest suite
        env:
          DATABASE_URL: postgresql+asyncpg://iam_user:iam_password@localhost:5432/iam_db
          REDIS_URL: redis://localhost:6379/0
          JWT_ALGORITHM: RS256
          JWT_PRIVATE_KEY_PATH: security/private.pem
          JWT_PUBLIC_KEY_PATH: security/public.pem
        run: |
          pytest -v

      - name: Build API Docker image
        run: |
          docker build -t ${{ env.API_IMAGE }}:ci .

      - name: Build Frontend Docker image
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }}:ci ./frontend

  publish:
    name: Publish Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}