name: IAM Service CI Pipeline

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  test-and-build:
    name: Test & Build Docker Images
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: iam_db
          POSTGRES_USER: iam_user
          POSTGRES_PASSWORD: iam_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iam_user -d iam_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate RSA keys for tests
        run: |
          mkdir -p security
          openssl genrsa -out security/private.pem 2048
          openssl rsa \
            -in security/private.pem \
            -pubout \
            -out security/public.pem

      - name: Compile Python code
        run: |
          python -m compileall -q app tests

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://iam_user:iam_password@localhost:5432/iam_db
          REDIS_URL: redis://localhost:6379/0
          JWT_ALGORITHM: RS256
          JWT_PRIVATE_KEY_PATH: security/private.pem
          JWT_PUBLIC_KEY_PATH: security/public.pem
        run: |
          alembic upgrade head

      - name: Run Pytest suite
        env:
          DATABASE_URL: postgresql+asyncpg://iam_user:iam_password@localhost:5432/iam_db
          REDIS_URL: redis://localhost:6379/0
          JWT_ALGORITHM: RS256
          JWT_PRIVATE_KEY_PATH: security/private.pem
          JWT_PUBLIC_KEY_PATH: security/public.pem
        run: |
          pytest -v

      - name: Build API Docker image
        run: |
          docker build -t iam-service-api:ci .

      - name: Build Frontend Docker image
        run: |
          docker build -t iam-service-frontend:ci ./frontend